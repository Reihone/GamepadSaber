name: Build GamepadSaber

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore src/GamepadSaber/GamepadSaber.csproj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Build project (Release)
        run: msbuild src/GamepadSaber/GamepadSaber.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Show build output files
        run: dir src\\GamepadSaber\\bin\\Release

      - name: Upload artifact (DLL)
        uses: actions/upload-artifact@v3
        with:
          name: GamepadSaber-dll
          path: src/GamepadSaber/bin/Release/*.dll
